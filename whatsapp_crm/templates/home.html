{% extends "base.html" %}

{% block title %}Home - WhatsApp CRM{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="px-4 text-center">
        <h1 class="display-5 fw-bold mb-4">Welcome, {{ user.username }}!</h1>
        <div class="col-lg-8 mx-auto">
            <p class="lead mb-3">You have successfully logged into the WhatsApp CRM.</p>
            <p class="lead mb-4">What would you like to do next?</p>
            <div class="d-grid gap-3 d-sm-flex justify-content-sm-center mt-4">
                <a href="{% url 'clients:client_list' %}" class="btn btn-primary btn-lg px-4 gap-3"><i class="bi bi-list-ul me-2"></i>View My Clients</a>
                <a href="{% url 'clients:client_add' %}" class="btn btn-secondary btn-lg px-4"><i class="bi bi-person-plus-fill me-2"></i>Add New Client</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

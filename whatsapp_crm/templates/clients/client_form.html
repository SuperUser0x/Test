{% extends "base.html" %}

{% block title %}{% if view.kwargs.pk %}Edit Client{% else %}Add Client{% endif %}{% endblock %}

{% block content %}
<h2>{% if view.kwargs.pk %}Edit Client: {{ client.name }}{% else %}Add New Client{% endif %}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if view.kwargs.pk %}Save Changes{% else %}Add Client{% endif %}</button>
</form>
<hr>
<a href="{% if view.kwargs.pk %}{% url 'clients:client_detail' client.pk %}{% else %}{% url 'clients:client_list' %}{% endif %}">Cancel</a>
{% endblock %}
